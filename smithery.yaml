# Smithery Registry Manifest — https://smithery.ai
name: po-pilot-mcp
startCommand:
  type: stdio
  configSchema:
    type: object
    additionalProperties: false
    properties:
      poPilotLicenseKey:
        type: string
        title: PO Pilot License Key (Optional)
        description: "Optional Polar.sh (`<org_uuid>:<key>`) or `POP1.*` key to unlock >25 SKUs and live Shopify sync."
      shopifyStoreDomain:
        type: string
        title: Shopify Store Domain (Optional)
        description: "Optional *.myshopify.com domain for live Admin API reads. Omit for CSV or demo_mode."
      shopifyAccessToken:
        type: string
        title: Shopify Admin Access Token (Optional)
        description: "Optional shpat_... token with read_products, read_inventory, read_orders."
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        ...(config.poPilotLicenseKey ? { PO_PILOT_LICENSE_KEY: config.poPilotLicenseKey } : {}),
        ...(config.shopifyStoreDomain ? { SHOPIFY_STORE_DOMAIN: config.shopifyStoreDomain } : {}),
        ...(config.shopifyAccessToken ? { SHOPIFY_ACCESS_TOKEN: config.shopifyAccessToken } : {})
      }
    })
  exampleConfig: {}
