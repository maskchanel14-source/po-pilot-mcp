name: Release to npm & Official MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Official MCP Registry GitHub OIDC auth + npm provenance
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Verify version parity across package.json, server.json & git tag
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          SRV_VER=$(node -p "require('./server.json').version")
          SRV_PKG_VER=$(node -p "require('./server.json').packages[0].version")
          if [ "$PKG_VER" != "$SRV_VER" ] || [ "$PKG_VER" != "$SRV_PKG_VER" ]; then
            echo "Version mismatch: package.json=$PKG_VER, server.json=$SRV_VER ($SRV_PKG_VER)"
            exit 1
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VER" != "$PKG_VER" ]; then
              echo "Git tag v$TAG_VER does not match package.json version $PKG_VER"
              exit 1
            fi
          fi

      - name: Install dependencies & verify test suite
        run: |
          npm ci
          npm audit --audit-level=high
          npm test

      - name: Publish package to npm (idempotent on re-run)
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "po-pilot-mcp@${PKG_VER}" version >/dev/null 2>&1; then
            echo "po-pilot-mcp@${PKG_VER} is already published on npm — skipping npm publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm registry CDN propagation before MCP Registry check
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            if curl -fsS "https://registry.npmjs.org/po-pilot-mcp/${PKG_VER}" >/dev/null 2>&1; then
              echo "Verified po-pilot-mcp@${PKG_VER} live on registry.npmjs.org"
              exit 0
            fi
            echo "Waiting for npm propagation (attempt $i/12)..."
            sleep 5
          done
          echo "Timed out waiting for npm propagation"
          exit 1

      - name: Install Sigstore cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Download & verify official mcp-publisher CLI
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          chmod +x mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate & publish server.json to Official MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
