# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "PO Pilot — Shopify Replenishment & 3-Way Match"
slug: "po-pilot-mcp"

runtime: typescript

build:
  install: "npm ci"
  command: "npm run build"

start:
  type: stdio
  command: "node"
  args:
    - "dist/index.js"

credentials:
  - name: "PO_PILOT_LICENSE_KEY"
    description: "Optional Polar.sh (<org_uuid>:<key>) or POP1.* license key to unlock unlimited SKUs and live Shopify sync."
  - name: "SHOPIFY_STORE_DOMAIN"
    description: "Optional Shopify store domain (your-store.myshopify.com) for live Admin GraphQL reads. Leave blank for CSV or demo_mode."
    docs_url: "https://help.shopify.com/en/manual/apps/app-types/custom-apps"
  - name: "SHOPIFY_ACCESS_TOKEN"
    description: "Optional read-only Shopify Admin API token (shpat_...) with read_products, read_inventory, and read_orders scopes."
    docs_url: "https://help.shopify.com/en/manual/apps/app-types/custom-apps"
