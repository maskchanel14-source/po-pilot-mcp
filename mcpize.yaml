# MCPize Deployment Manifest — validated against mcpize@1.2.2 ManifestSchema
# Deploy: npm install -g mcpize && mcpize login && mcpize deploy --yes
#
# Recommended Subscription Tiers (set in MCPize Developer Dashboard -> Monetization):
#   - Free Sandbox ($0/mo): 15 requests/month
#   - Pro Store ($19/mo):   300 requests/month
#   - Agency ($59/mo):      2,500 requests/month
version: 1
name: po-pilot-mcp
description: >-
  Replaces Shopify Stocky's retired purchasing workflow: stockout-adjusted
  velocity & Z-score safety stock, supplier MOQ/carton Purchase Orders + Shopify
  Draft PO CSVs, Stocky CSV supplier recovery, and Accounts Payable 3-way match.

runtime: typescript
entry: dist/index.js

build:
  install: npm ci
  command: npm run build

startCommand:
  type: stdio
  command: node
  args:
    - dist/index.js

# Private publisher secret (set in MCPize Dashboard -> Secrets to unlock >25 SKUs on your hosted cloud):
secrets:
  - name: PO_PILOT_SERVER_LICENSE_KEY
    required: false
    description: Optional publisher-level Polar/POP1 license key so hosted Pro/Agency cloud subscribers get unlimited SKUs.

# Optional per-user BYO credentials (credential name maps directly to ENV var at runtime):
credentials:
  - name: PO_PILOT_LICENSE_KEY
    required: false
    description: Optional Polar.sh (<org_uuid>:<key>) or POP1.* license key to unlock unlimited SKUs and live Shopify sync.
    placeholder: "fda84e25-7b55-4d67-916d-60ead04ff61f:POLAR-XXXX"
  - name: SHOPIFY_STORE_DOMAIN
    required: false
    description: Optional Shopify store domain (your-store.myshopify.com) for live Admin GraphQL reads. Leave blank for CSV or demo_mode.
    placeholder: "your-store.myshopify.com"
    docs_url: https://help.shopify.com/en/manual/apps/app-types/custom-apps
  - name: SHOPIFY_ACCESS_TOKEN
    required: false
    description: Optional read-only Shopify Admin API token (shpat_...) with read_products, read_inventory, and read_orders scopes.
    placeholder: "shpat_..."
    docs_url: https://help.shopify.com/en/manual/apps/app-types/custom-apps

credentials_mode: per_user

